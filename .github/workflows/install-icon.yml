name: Install school calendar app icon

on:
  push:
    paths:
      - .github/workflows/install-icon.yml

permissions:
  contents: write

jobs:
  install-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PNG icon
        run: base64 --decode .icon.b64 > apple-touch-icon.png

      - name: Update calendar icon links
        run: python3 scripts/install_icon.py

      - name: Remove temporary icon data
        run: |
          rm -f .icon.b64
          rm -rf .icon_parts

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add home screen app icon"
          git push
