name: Install school calendar app icon

on:
  push:
    paths:
      - .github/workflows/install-icon.yml

permissions:
  contents: write

jobs:
  install-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PNG icon
        run: |
          cat .icon64/part00.txt .icon64/part01.txt .icon64/part02.txt > icon.b64
          base64 --decode icon.b64 > apple-touch-icon.png
          test "$(head -c 8 apple-touch-icon.png | xxd -p)" = "89504e470d0a1a0a"

      - name: Update calendar icon links
        run: python3 scripts/install_icon.py

      - name: Remove temporary icon data
        run: |
          rm -f icon.b64 .icon.b64
          rm -rf .icon_parts .icon64

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add home screen app icon"
          git push
